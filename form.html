<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Revies</title>
    <link rel="stylesheet" href="styles/form.css">
    <meta name="author" content="Cesar Steven Fermin Cabrera">
    <meta name="description" content="This page will be containing a form of differents products and will be used as a feedback of how well it is for the client">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <h1>Product review</h1>
        
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <fieldset>
                <div class="product">
                <label for="productList"> Choose a product
                <select name="productList" id="productList" required>
                    <option value="" id="option" disabled selected>Select a Product &#9662;</option>

                </select>
                </label>
                </div>
                
                <div class="overal">
                    <label>Overal Rating</label>
                    <div class="rating">
                    <label for="qualification1"><input type="radio" name="qualification" id="qualification1" value="1star" required>&star;</label>
                    <label for="qualification2"><input type="radio" name="qualification" id="qualification2" value="2star" required>&star;&star;</label>
                    <label for="qualification3"><input type="radio" name="qualification" id="qualification3" value="3star" required>&star;&star;&star;</label>
                    <label for="qualification4"><input type="radio" name="qualification" id="qualification4" value="4star" required>&star;&star;&star;&star;</label>
                    <label for="qualification5"><input type="radio" name="qualification" id="qualification5" value="5star" required>&star;&star;&star;&star;&star;</label>
                    </div>
                </div>
                <div class="instalation">
                    <label for="instalation">Date of Instalation</label>
                    <input type="date" id="instalation" name="instalation" required>
                </div>
            </fieldset>
            <fieldset>
            <div class="feature">
            <label>Which features did you find useful in the product? (Check all that apply)</label>
                <label for="features1"><input type="checkbox" id="features1" name="features" required>Durability</label>
                <label for="features2"><input type="checkbox" id="features2" name="features" required>Ease of Use</label>
                <label for="features3"><input type="checkbox" id="features3" name="features" required>Performance</label>
                <label for="features4"><input type="checkbox" id="features4" name="features" required>Design</label>
            </div>
            <div class="review">
                <label for="review">Write a review</label>
                <textarea name="review" id="review"></textarea>
                
                <label for="name">Your name</label>
                <input type="text" name="name" id="name">
            </div>
            </fieldset>
            <input type="submit" value="Send Review">
        </form>
    </main>
    <footer>
        &copy;🌄Cesar Steven Fermin🌄 Dominican Republic
    </footer>
</body>
</html>
