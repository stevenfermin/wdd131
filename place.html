<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="author" content="Cesar Steven Fermin Cabrera">
    <meta name="description" content="This page is dedicated to show information about Dominican Republic that is the country selected to show in this case">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Dominican Republic</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/rd-large.webp" media="(min-width: 1000px)">
                <source srcset="images/rd-medium.webp" media="(min-width: 500px)">
                <img src="images/rd-short.webp" alt="Dominican Republic Picture" width="500" height="250">
            </picture>
        <section class="data">
            <h2>Data</h2>
            <label for="area" id="area">Area: <label aria-label="area"></label></label> 
            <label for="population" id="population">Population:<label name="population"></label></label>
            <label for="capital" id="capital">Capital:<label name="capital"></label></label>
            <label for="language" id="languages">Languages:<label name="languages"></label></label>
            <label for="currency" id="currency">Currency:<label name="currency"></label></label>
            <label for="time-zone" id="time-zone">Time Zone:<label name="time-zone"></label></label>
            <label for="calling-code" id="calling-code">Calling Code:<label name="calling-code"></label></label>
            <label for="internet-tld" id="internet-tld">Internet TLD: <label name="internet-tld"></label></label>
        </section>
        <section class="weather">
            <h2>Weather<img src="images/weather.svg" alt=""></h2>
            <label for="temperature" id="temperature">Temperature: <label name="temperature"></label></label>
            <label for="conditions" id="conditions">Conditions: <label name="conditions"></label></label>
            <label for="wind" id="wind">Wind: <label name="wind"></label></label>
            <label for="wind-chill" id="wind-chill">Wind Chill: <label name="wind-chill"></label></label>
        </section>
        </div>
    </main>
    <footer>

    </footer>
    
</body>
</html>
