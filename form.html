<head>

<body>
    <header>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <h1>Product review</h1>
        
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <label>
            <select name="products" id="productList" required>
                <option value="" id="option" name="select" disabled selected>Select a Product</option>

            </select>
            </label>
            <div>Overall Rating</div>
            <label id="qualification" name="qualification" for="qualification"><input type="radio" name="qualification" id="qualitication" value="1star" required>&star;</label>
            <label id="qualification" name="qualification" for="qualification"><input type="radio" name="qualification" id="qualitication" value="2star" required>&star;&star;</label>
            <label id="qualification" name="qualification" for="qualification"><input type="radio" name="qualification" id="qualitication" value="3star" required>&star;&star;&star;</label>
            <label id="qualification" name="qualification" for="qualification"><input type="radio" name="qualification" id="qualitication" value="4star" required>&star;&star;&star;&star;</label>
            <label id="qualification" name="qualification" for="qualification"><input type="radio" name="qualification" id="qualitication" value="5star" required>&star;&star;&star;&star;&star;</label>

            <label for="instalation">Date of Instalation</label>
            <input type="date" id="instalation" name="instalation" required>

            <label for="features">Which features did you find useful in the product?</label>
            <label for=""><input type="checkbox" id="features" name="features" required>Durability</label>
            <label for=""><input type="checkbox" id="features" name="features" required>Ease of Use</label>
            <label for=""><input type="checkbox" id="features" name="features" required>Performance</label>
            <label for=""><input type="checkbox" id="features" name="features" required>Design</label>

            <label for="review">Write a review</label>
            <textarea name="review" id="review"></textarea>

            <input type="submit" value="Send Review">
        </form>
    </main>

</html>
